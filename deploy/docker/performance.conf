# Icons use short caching, including fallbacks referenced by older pages.
# Keep this before the generic asset location; never fall back to application HTML.
location ~ ^/(icon(-dark)?\.(ico|png)|touch\.png|icon-(light|dark)\.svg|docs\.(ico|png)|docs-(touch\.png|light\.svg|dark\.svg)|favicon\.(ico|png)|apple-touch-icon(-precomposed)?\.png|assets/icon-(180x180\.png|dark\.svg|light\.svg))$ {
    expires off;
    add_header Cache-Control "public, max-age=300, must-revalidate";
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    access_log off;
    log_not_found off;
    try_files $uri =404;
}

# Preserve the base image's asset, font and compression policies.
location = /robots.txt {
    log_not_found off;
    access_log off;
    try_files $uri /index.php?$query_string;
}

location ~* \.(?:css(\.map)?|js(\.map)?|jpe?g|png|gif|ico|cur|heic|webp|tiff?|mp3|m4a|aac|ogg|midi?|wav|mp4|mov|webm|mpe?g|avi|ogv|flv|wmv|svgz?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    log_not_found off;
    try_files $uri /index.php?$query_string;
}

location ~* \.(?:ttf|ttc|otf|eot|woff2?)$ {
    add_header Access-Control-Allow-Origin "*";
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;
